name: Daily data update

# Runs every day at 12:00 AM (00:00) UTC.
# Purpose: pick up THAT day's match results everywhere, and catch newly
# published fixtures — including each new domestic-cup round as it is drawn
# (a draw becomes visible within a day, which covers "once per round").
# League fixture DATE/TIME stability is re-checked monthly by monthly-data-audit.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # STEP 1: Build football data
      - name: Build all leagues
        run: python build.py

      # STEP 2: Diagnose La Liga data generated on GitHub
      - name: Debug La Liga data
        if: always()
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from collections import defaultdict

          folder = Path("data/ESP_1_la-liga")
          matches = defaultdict(list)
          total = 0

          print("\n========== LA LIGA DEBUG ==========")

          for name in ("results_2627.csv", "fixtures_2627.csv"):
              path = folder / name

              if not path.exists():
                  print(f"MISSING FILE: {path}")
                  continue

              with path.open(encoding="utf-8", newline="") as f:
                  rows = list(csv.DictReader(f))

              total += len(rows)
              print(f"\n{name}: {len(rows)} records")

              for i, row in enumerate(rows, start=2):
                  home = row.get("home", "").strip()
                  away = row.get("away", "").strip()
                  date = row.get("date", "").strip()

                  key = (
                      home.casefold(),
                      away.casefold(),
                      date,
                  )

                  matches[key].append((name, i))

                  print(f"{name}:{i} | {date} | {home} vs {away}")

          print("\n========== SUMMARY ==========")
          print(f"Total records: {total}")
          print("Expected records: 380")
          print(f"Difference: {total - 380}")

          print("\n========== DUPLICATE MATCHES ==========")

          duplicates_found = False

          for match, locations in matches.items():
              if len(locations) > 1:
                  duplicates_found = True
                  print(f"DUPLICATE: {match}")
                  print(f"Locations: {locations}")

          if not duplicates_found:
              print("No exact match-identity duplicates detected.")

          print("\n========== END DEBUG ==========")
          PY
          
      # Gate: never push structurally broken data. A red run emails the
      # maintainer; fix the reported error, then re-run via workflow_dispatch.
      # STEP 3: Validate data correctness
      - name: Validate data correctness
        run: python scripts/check_data.py

      # STEP 4: Preserve generated data if validation fails
      - name: Upload failed build data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-data
          path: |
            data/ESP_1_la-liga/
            build_summary.json
          retention-days: 7

      # STEP 5: Commit only when validation succeeds
      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data refresh $(date -u +%F)"
            git push
          fi
